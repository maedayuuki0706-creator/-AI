name: Naruto Sheet Backfill

on:
  push:
    branches:
      - naruto-sheet-backfill-20261005
    paths:
      - 'tools/naruto_sheet_backfill.py'
      - '.github/workflows/naruto-sheet-backfill.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Naruto official results
        run: PYTHONPATH=. python tools/naruto_sheet_backfill.py
      - name: Persist Naruto backfill on isolated branch
        run: |
          mkdir -p data/sheet_backfill
          cp naruto_backfill_20260927_20261002.json data/sheet_backfill/naruto_backfill_20260927_20261002.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sheet_backfill/naruto_backfill_20260927_20261002.json
          git commit -m "Persist Naruto sheet backfill data" || exit 0
          git push origin HEAD:naruto-sheet-backfill-20261005
      - name: Upload Naruto backfill
        uses: actions/upload-artifact@v4
        with:
          name: naruto-backfill-20260927-20261002
          path: naruto_backfill_20260927_20261002.json
          if-no-files-found: error
