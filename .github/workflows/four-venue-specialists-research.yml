name: Four Venue Specialists - Research Log Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/four-venue-specialists-research.yml']
  schedule:
    # Backup starts, offset from the crowded top of the hour. The bounded worker
    # polls every minute and chains the next independent research run.
    - cron: '3,13,23,33,43,53 23,0-14 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: research-four-venue-specialists-independent
  cancel-in-progress: false

jobs:
  research-log-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/four-venue-specialists-20261017
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/
            /data/sheet_db/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate research tests
        run: |
          python -m unittest discover -s research/venue_specialists_v1/tests -v
          python -m unittest discover -s research/scenario_v2/tests -v
      - name: Open isolated research state
        run: |
          git fetch --depth=1 origin research-venue-specialists-state:refs/remotes/origin/research-venue-specialists-state
          git -c core.sparseCheckout=false worktree add --detach "$RUNNER_TEMP/venue-specialists-state" refs/remotes/origin/research-venue-specialists-state
          git -C "$RUNNER_TEMP/venue-specialists-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/venue-specialists-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "VENUE_SPECIALIST_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Capture, push, confirm and review every minute
        run: python -m research.venue_specialists_v1.worker --state "$RUNNER_TEMP/venue-specialists-state" --seconds 480 --interval 60
      - name: Retain research evidence on persistence failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: venue-research-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/venue-specialists-state/data/venue_specialists_v1/
          retention-days: 14
          if-no-files-found: ignore
      - name: Request the next research-only run during JST operation
        if: always()
        env:
          GH_RESEARCH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os, urllib.request
          now=datetime.now(ZoneInfo('Asia/Tokyo'))
          if 8<=now.hour<24:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/four-venue-specialists-research.yml/dispatches'
              request=urllib.request.Request(url,data=json.dumps({'ref':'main'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_RESEARCH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  print('Independent research continuation requested:',response.status)
          else:
              print('Outside JST operation; backup schedule starts the next day.')
          PY
