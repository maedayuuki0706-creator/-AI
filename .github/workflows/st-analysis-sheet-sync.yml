name: ST Analysis Sheet Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_st_analysis_sheet.py'
      - '.github/workflows/st-analysis-sheet-sync.yml'

permissions:
  contents: read

concurrency:
  group: st-analysis-sheet-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify ST sync
        run: python -m py_compile sync_st_analysis_sheet.py direct_discord_notify.py race_context.py

      - name: Install Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Sync live ST analysis data
        env:
          TZ: Asia/Tokyo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: "1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo"
          ST_TODAY_SHEET: "ST当日出走_RAW"
          ST_RESULT_SHEET: "ST節間結果_RAW"
          ST_ANALYSIS_SHEET: "ST展開分析"
          ST_RESULT_FETCH_CAP: "72"
        run: python -u sync_st_analysis_sheet.py
