name: Inspect All Races API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/all_races_tomorrow.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check raw races API
        run: |
          python3 - <<'PY'
          import urllib.request

          url = "https://boat-ai-partner.gpmy262mkw.chatgpt.site/api/races"

          req = urllib.request.Request(
              url,
              data=b"{}",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Boat-AI-Inspector/1.0"
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=60) as res:
              body = res.read().decode("utf-8", "replace")

          print("=== RAW RESPONSE ===")
          print(body[:30000])

          PY
