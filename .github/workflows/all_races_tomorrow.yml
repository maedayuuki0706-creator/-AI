name: Inspect All Races API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/all_races_tomorrow.yml"
      - "notify_discord.py"
      - "tests/test_notify_discord.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test unpublished data and notification error handling
        run: python -m unittest discover -s tests -v

      - name: Check races API without sending Discord messages
        run: python notify_discord.py --check
