name: Apply Selected Mid Odds Once

on:
  push:
    branches: [main]
    paths:
      - "apply_selected_mid_once.py"
      - ".github/workflows/apply_selected_mid_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply routing patch
        run: python apply_selected_mid_once.py

      - name: Verify selected webhook
        env:
          DISCORD_WEBHOOK_MID_ODDS_SELECTED: ${{ secrets.DISCORD_WEBHOOK_MID_ODDS_SELECTED }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          url = os.environ.get("DISCORD_WEBHOOK_MID_ODDS_SELECTED", "").strip()
          if not url:
              raise RuntimeError("DISCORD_WEBHOOK_MID_ODDS_SELECTED is missing")
          body = json.dumps({
              "content": "🚨 **厳選中穴予想｜接続テスト**\n新しい配信元の接続OKです👌",
              "allowed_mentions": {"parse": []},
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as res:
              if res.status not in (200, 204):
                  raise RuntimeError(f"Discord HTTP {res.status}")
          PY

      - name: Commit patched files
        run: |
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add opportunity_alerts.py .github/workflows/discord_notify.yml
          git commit -m "Route selected mid-odds predictions separately" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
