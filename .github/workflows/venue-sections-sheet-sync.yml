name: Venue 24 Sheets Section Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only inspect 24 venue tabs without writing
        required: false
        default: '1'
  schedule:
    # Stagger after ST and foot-trend collectors; reporting only.
    - cron: '16,31,46,1 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_venue_sections.py'
      - 'tests/test_sync_venue_sections.py'
      - '.github/workflows/venue-sections-sheet-sync.yml'

permissions:
  contents: read

concurrency:
  group: venue-24-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Verify result deduplication and manual slot protection
        run: |
          python -m py_compile sync_venue_sections.py
          python -m unittest discover -s tests -p 'test_sync_venue_sections.py' -v

      - name: Update active 24 venue meeting sheets
        env:
          TZ: Asia/Tokyo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: '1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo'
          VENUE_NEW_MEETINGS_CAP: '2'
          # Scheduled/push runs write confirmed data. Manual default is safe dry-run.
          VENUE_SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != '0' && '1' || '0' }}
        run: python -u sync_venue_sections.py
