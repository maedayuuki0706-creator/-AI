name: Tsu Morning Card 2026-09-30

on:
  schedule:
    # 2026-09-30 08:05 JST
    - cron: "5 23 29 9 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-tsu-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send Tsu race card to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          TSU_TARGET_DAY: "20260930"
        run: python send_tsu_morning_card.py
