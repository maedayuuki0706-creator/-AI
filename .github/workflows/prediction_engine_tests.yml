name: Prediction Engine Tests

on:
  push:
    branches: [main]
    paths:
      - "prediction_engine.py"
      - "direct_discord_notify.py"
      - "discord_formation.py"
      - "discord_detail_formatter.py"
      - "race_context.py"
      - "notification_policy.json"
      - "daily_learning.py"
      - "daily_report.py"
      - "morning_all_races_discord.py"
      - "detailed_discord_notify.py"
      - "virtual_betting.py"
      - "tests/**"
      - "tests/test_prediction_engine.py"
      - ".github/workflows/prediction_engine_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run prediction engine tests
        run: python3 -m unittest discover -s tests -v
