name: Discord Withdrawal Review No-Send Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'delivery_v2/withdrawal_review.py'
      - 'tests/test_delivery_v2_withdrawal_review.py'
      - '.github/workflows/discord-withdrawal-no-send.yml'

permissions:
  contents: read

jobs:
  no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing guards and offline withdrawal review without any network
        run: |
          python - <<'PY'
          import contextlib, io, socket, unittest, urllib.request
          from unittest.mock import patch
          def blocked(*args, **kwargs):
              raise AssertionError('External network forbidden in no-send tests')
          with patch.object(socket.socket, 'connect', blocked), patch.object(socket.socket, 'connect_ex', blocked), patch.object(urllib.request, 'urlopen', blocked):
              suite = unittest.defaultTestLoader.discover('tests', pattern='test_delivery_v2*.py')
              with contextlib.redirect_stdout(io.StringIO()):
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
