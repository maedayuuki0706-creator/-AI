name: PT2 Sheet DB Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync_pt2_sheet_db.py'
      - 'pt2_sheet_db.py'
      - 'sync_pt2_prediction_sheet.py'
      - 'pt2_strategy_cards.py'
      - 'tests/test_sync_pt2_prediction_sheet.py'
      - 'data/prototype12_delivery/predictions/**'
      - 'tests/test_sync_pt2_sheet_db.py'
      - 'tests/test_pt2_sheet_db.py'
      - '.github/workflows/pt2-sheet-db-sync.yml'
  schedule:
    # Every 30 minutes. Only commits when source data actually changes.
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: pt2-sheet-db-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify parsers and PT2 adapter
        run: |
          python -m py_compile sync_pt2_sheet_db.py pt2_sheet_db.py sync_pt2_prediction_sheet.py
          python -m unittest discover -s tests -p 'test_sync_pt2_sheet_db.py' -v
          python -m unittest discover -s tests -p 'test_pt2_sheet_db.py' -v
          python -m unittest discover -s tests -p 'test_sync_pt2_prediction_sheet.py' -v

      - name: Install Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Refresh full PT2 database snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: "1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo"
          PT2_DB_MIN_PLAYERS: "1200"
          PT2_DB_MIN_MOTORS: "1000"
          PT2_DB_MIN_VENUES: "24"
        run: |
          python sync_pt2_sheet_db.py
          python sync_pt2_prediction_sheet.py

      - name: Persist snapshot only when source data changed
        run: |
          git config user.name 'pt2-sheet-db-bot'
          git config user.email 'actions@users.noreply.github.com'

          # Ignore meta timestamp when deciding whether the underlying data changed.
          git add data/sheet_db/players.json data/sheet_db/motors.json data/sheet_db/venues.json
          if git diff --cached --quiet; then
            echo "PT2 sheet data unchanged; no commit needed."
            git restore data/sheet_db/meta.json || true
            exit 0
          fi

          git add data/sheet_db/meta.json
          git commit -m 'Refresh PT2 sheet database snapshot'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
