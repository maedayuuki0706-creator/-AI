name: Edogawa Phase 2 - Independent Manual Research
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: preflight
        options: [preflight, capture]
      rno:
        description: Today's Edogawa race; capture requires an existing verified pre-deadline source
        type: string
        default: '1'
permissions:
  contents: write
concurrency:
  group: edogawa-phase2-independent-only
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/research/edogawa-phase2-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research safety and cutoff tests
        run: python -m unittest discover -s research/edogawa_phase2/tests -q
      - uses: actions/checkout@v4
        with:
          ref: research-venue-specialists-state
          path: phase2-source-readonly
          sparse-checkout: |
            data/venue_specialists_v1/inputs
            data/venue_specialists_v1/forecasts
            data/venue_specialists_v1/receipts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research-edogawa-phase2-state
          path: phase2-independent-state
      - name: Prepare independent Git identity
        run: |
          git -C phase2-independent-state config user.name github-actions[bot]
          git -C phase2-independent-state config user.email github-actions[bot]@users.noreply.github.com
      - name: One bounded passive research capture or read-only preflight
        env:
          EDOGAWA_PHASE2_MODE: ${{ inputs.mode }}
          EDOGAWA_PHASE2_RNO: ${{ inputs.rno }}
        run: |
          python -m research.edogawa_phase2.feed --source-state phase2-source-readonly --state phase2-independent-state --model research/edogawa_phase2/model_manifest.json --mode "$EDOGAWA_PHASE2_MODE" --rno "$EDOGAWA_PHASE2_RNO"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-phase2-failure
          path: phase2-independent-state/data/edogawa_phase2_shadow/
          retention-days: 7
