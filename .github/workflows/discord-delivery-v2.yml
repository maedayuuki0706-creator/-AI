name: Discord Delivery V2 Validation
on:
  workflow_dispatch:
  push:
    branches: [discord-delivery-v2]
    paths:
      - 'delivery_v2/**'
      - 'tests/test_delivery_v2.py'
      - '.github/workflows/discord-delivery-v2.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V2 delivery layer without posting
        run: python -m unittest tests.test_delivery_v2 tests.test_delivery_v2_receipts -v
