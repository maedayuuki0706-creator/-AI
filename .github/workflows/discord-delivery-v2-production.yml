name: Discord Delivery V2 Production Dispatcher
on:
  workflow_dispatch:
    inputs:
      wake_reason:
        description: 'Production wake-up origin'
        required: false
        default: 'manual'
        type: string
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'delivery_v2/**'
      - '.github/workflows/discord-delivery-v2-production.yml'

permissions:
  contents: write
  actions: write
concurrency:
  group: discord-delivery-v2-production
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Large prediction journals can make checkout slow; avoid losing the continuation on a slow runner.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify delivery guards without posting
        id: guards
        run: python -m unittest discover -s tests -p 'test_delivery_v2*.py' -v
      - name: Mark production wake-up time
        run: echo "DELIVERY_V2_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
      # Wake critical legacy channels BEFORE the 150-second scan and reporting,
      # then reserve the next V2 pass; durable claims prevent duplicate messages.
      - name: Prime core channels and next guarded delivery pass
        if: github.ref == 'refs/heads/main' && steps.guards.conclusion == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from delivery_v2.wakeup import DISPATCHER, wake
          for workflow in ('discord_notify.yml', 'sokuhou-delivery.yml', 'x-delivery-v2-production.yml'):
              try:
                  print('Delivery V2 preflight: ' + str(wake(workflow)), flush=True)
              except Exception as exc:
                  print('::warning::Delivery preflight ' + workflow + ' ' + type(exc).__name__, flush=True)
          print('Delivery V2 next pass: ' + str(wake(
              DISPATCHER, current_run_id=os.getenv('GITHUB_RUN_ID', ''), continuation=True
          )), flush=True)
          PY
      - name: Confirm production transport and restart deduplication
        # A normal code push must not add an unsolicited Discord probe.
        if: github.event_name == 'workflow_dispatch' && inputs.wake_reason == 'canary'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PT3_DISCORD_WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL || secrets.PROTO3_DISCORD_WEBHOOK_URL }}
          DISCORD_DELIVERY_V2_CANARY_PHASE: 'production-20261004'
        run: python -m delivery_v2.canary
      - name: Discover current races and catch up before deadlines
        env:
          TZ: Asia/Tokyo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_DELIVERY_V2_STREAMS: 'yuuki,yuuki_selected'
          DISCORD_DELIVERY_V2_WAKE_REASON: ${{ inputs.wake_reason || github.event_name }}
          # Persist rollout coverage across midnight, including a late first wake-up.
          DISCORD_DELIVERY_V2_ACTIVE_SINCE: '2026-10-04T20:53:00+09:00'
          PT3_DISCORD_WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL }}
          PROTO3_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO3_DISCORD_WEBHOOK_URL }}
          PT3_SELECTED_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SELECTED_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
        run: python -u -m delivery_v2.dispatcher --budget-seconds 150 --recheck-seconds 20
      - name: Refresh delivered-only PT standings
        if: always()
        run: python -u prototype_scoreboard.py
      - name: Save legacy reporting mirrors
        if: always()
        continue-on-error: true
        # Legacy Yuuki owns mutable status publication; V2 diagnostics are in
        # the durable checkpoint and artifacts. Both retain immutable reports.
        run: python persist_runtime_data.py data/prototype3_delivery/ --exclude data/prototype3_delivery/status/
      - name: Preserve acknowledgements and watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-v2-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/delivery_v2_recovery/
            data/delivery_v2_receipts/
            data/prototype3_delivery/
            data/prototype_scoreboard/
          retention-days: 14
      - name: Continue production and wake inactive legacy deliveries
        if: always() && !cancelled() && steps.guards.conclusion == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_DELIVERY_V2_CONTINUATION_ENABLED: ${{ vars.DISCORD_DELIVERY_V2_CONTINUATION_ENABLED || '1' }}
        run: python -u -m delivery_v2.wakeup
