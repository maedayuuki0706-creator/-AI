name: Boat AI Navi official 2016-2019 research archives
on:
  push:
    branches:
      - feature/boaters-data-research-20261025
    paths:
      - '.github/workflows/boaters-official-historical-2016-2019-backfill.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Remain queued until the ongoing 2020-2021 official historical research run finishes.
  group: boat-navi-official-history-research-one-at-a-time
  cancel-in-progress: false
jobs:
  acquire_quarterly_official:
    name: "Historical official B/K ${{ matrix.period }}"
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {period: "2019-Q4", start: "2019-10-01", end: "2019-12-31", files: 184}
          - {period: "2019-Q3", start: "2019-07-01", end: "2019-09-30", files: 184}
          - {period: "2019-Q2", start: "2019-04-01", end: "2019-06-30", files: 182}
          - {period: "2019-Q1", start: "2019-01-01", end: "2019-03-31", files: 180}
          - {period: "2018-Q4", start: "2018-10-01", end: "2018-12-31", files: 184}
          - {period: "2018-Q3", start: "2018-07-01", end: "2018-09-30", files: 184}
          - {period: "2018-Q2", start: "2018-04-01", end: "2018-06-30", files: 182}
          - {period: "2018-Q1", start: "2018-01-01", end: "2018-03-31", files: 180}
          - {period: "2017-Q4", start: "2017-10-01", end: "2017-12-31", files: 184}
          - {period: "2017-Q3", start: "2017-07-01", end: "2017-09-30", files: 184}
          - {period: "2017-Q2", start: "2017-04-01", end: "2017-06-30", files: 182}
          - {period: "2017-Q1", start: "2017-01-01", end: "2017-03-31", files: 180}
          - {period: "2016-Q4", start: "2016-10-01", end: "2016-12-31", files: 184}
          - {period: "2016-Q3", start: "2016-07-01", end: "2016-09-30", files: 184}
          - {period: "2016-Q2", start: "2016-04-01", end: "2016-06-30", files: 182}
          - {period: "2016-Q1", start: "2016-01-01", end: "2016-03-31", files: 182}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated archive collector
        run: python3 -m py_compile viewer/research/collect_official_lzh.py
      - name: Download official historical results and race cards slowly, isolated
        timeout-minutes: 79
        run: |
          python3 viewer/research/collect_official_lzh.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --delay 5.0 --no-racers \
            --max-requests "${{ matrix.files }}" \
            --out "/tmp/boater-history-2016-2019/${{ matrix.period }}"
      - name: Print real file success and missing/provider-throttled counts
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('/tmp/boater-history-2016-2019').glob('*/manifest.json'):
              j=json.loads(path.read_text())
              print('HIST_2016_2019',path.parent.name,'planned',j['planned'],
                    'statuses',j['statuses'],'bytes',j['downloaded_bytes'],
                    'provider_blocked',j['provider_blocked'])
          PY
      - name: Preserve downloaded originals privately for 90-day retrieval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "boat-navi-official-historical-${{ matrix.period }}"
          path: "/tmp/boater-history-2016-2019/${{ matrix.period }}/"
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
