name: Temporary upset level patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary_upset_level_patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Convert upset display to five levels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('opportunity_character.py')
          text = path.read_text(encoding='utf-8')

          marker = '\ndef _replace_metric_display(message, analysis, picks, score):\n'
          helper = '''\ndef _upset_level(score):
              """Convert the internal 0-100 volatility score to a user-facing five-level label."""
              score = max(0, min(100, int(round(_num(score)))))
              if score >= 80:
                  return "Lv5｜大荒れ警戒"
              if score >= 60:
                  return "Lv4｜波乱気配"
              if score >= 40:
                  return "Lv3｜混戦気味"
              if score >= 20:
                  return "Lv2｜落ち着き気味"
              return "Lv1｜かなり穏やか"

          '''
          if 'def _upset_level(score):' not in text:
              text = text.replace(marker, helper + marker, 1)

          text = text.replace('f"🌊 **荒れ期待度 {upset}/100**",', 'f"🌊 **荒れ期待度 {_upset_level(upset)}**",')
          text = text.replace('payload["upset_expectation"] = upset\n', 'payload["upset_expectation"] = upset\n        payload["upset_level"] = _upset_level(upset)\n', 1)
          text = text.replace('"upset_expectation": upset,\n            "upset_breakdown": upset_parts,\n            "metric_version": "opportunity-three-metrics-v1",', '"upset_expectation": upset,\n            "upset_level": _upset_level(upset),\n            "upset_breakdown": upset_parts,\n            "metric_version": "opportunity-three-metrics-v2",', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temporary_upset_level_patch.yml
          git add opportunity_character.py
          git commit -m "Show upset expectation in five levels"
          git pull --rebase origin main
          git push origin HEAD:main
