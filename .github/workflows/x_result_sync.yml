name: X Result Auto Post
# emergency-kick 2026-10-04T16:00+09:00

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "x_post_delivery.py"
      - "api_server.py"
      - "x_delivery_store.py"
      - ".github/workflows/x_result_sync.yml"

permissions:
  contents: write

concurrency:
  group: x-delivery-production
  cancel-in-progress: false

jobs:
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish settled X results
        env:
          TZ: Asia/Tokyo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: X_DELIVERY_SOURCE_COMMIT="$(git rev-parse HEAD)" python -u -m x_delivery_v2.dispatcher --mode results --budget-seconds 90

      - name: Preserve X result acknowledgement recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-results-v2-${{ github.run_id }}
          path: data/x_delivery_v2_recovery/
          if-no-files-found: ignore
