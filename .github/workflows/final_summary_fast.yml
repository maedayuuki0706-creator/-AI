name: Boat AI Fast Final Summary
on:
  push:
    branches: [main]
    paths:
      - "final_summary_fast.py"
      - ".github/workflows/final_summary_fast.yml"
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build final summary
        run: python final_summary_fast.py
      - name: Persist final summary and results
        run: |
          git config user.name boat-ai-learning-bot
          git config user.email actions@users.noreply.github.com
          git add data/official_results/20260914.json data/stake_simulations/20260914_3000.json data/final_summary_20260914.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 20260914 final summary"
          git pull --rebase origin main
          git push origin HEAD:main
