name: X Post Discord Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/x_post_test.yml"
      - "x_post_delivery.py"
      - "x_delivery_policy.py"
      - "x_delivery_store.py"
      - "x_api_client.py"
      - "x_featured_selector.py"
      - "api_server.py"
      - "tests/test_x_delivery.py"
      - "tests/test_x_featured_selector.py"
  workflow_dispatch:

jobs:
  send-test-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate X draft delivery
        run: |
          python -m unittest discover -s tests -p 'test_x_delivery.py' -v
          python -m unittest discover -s tests -p 'test_x_featured_selector.py' -v
          python -m py_compile x_featured_selector.py x_post_delivery.py api_server.py

      - name: Send X draft smoke test to Discord
        if: github.event_name == 'workflow_dispatch'
        env:
          X_POST_DISCORD_WEBHOOK_URL: ${{ secrets.X_POST_DISCORD_WEBHOOK_URL }}
        run: python x_post_delivery.py --smoke-test
