name: X Post Discord Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/x_post_test.yml"
      - "x_post_delivery.py"
  workflow_dispatch:

jobs:
  send-test-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate X draft delivery
        run: python -m py_compile x_post_delivery.py

      - name: Send X draft smoke test to Discord
        env:
          X_POST_DISCORD_WEBHOOK_URL: ${{ secrets.X_POST_DISCORD_WEBHOOK_URL }}
        run: python x_post_delivery.py --smoke-test
