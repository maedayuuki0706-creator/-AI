name: X Featured Value Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "data/prototype12_delivery/predictions/**"
      - "data/prototype3_delivery/predictions/**"
      - "x_featured_selector.py"
      - "x_post_delivery.py"
      - "x_delivery_policy.py"
      - "x_delivery_store.py"
      - "api_server.py"
      - ".github/workflows/x-featured-value.yml"

permissions:
  contents: write

concurrency:
  group: x-delivery-production
  cancel-in-progress: false

jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout latest prediction data
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate featured selector
        run: python -m unittest discover -s tests -p 'test_x_delivery_v2*.py' -v

      - name: Dispatch up to ten featured value races with durable receipts
        env:
          TZ: Asia/Tokyo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: X_DELIVERY_SOURCE_COMMIT="$(git rev-parse HEAD)" python -u -m x_delivery_v2.dispatcher --budget-seconds 90

      - name: Preserve X acknowledgement recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-featured-v2-${{ github.run_id }}
          path: data/x_delivery_v2_recovery/
          if-no-files-found: ignore
