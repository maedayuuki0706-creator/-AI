name: Materials applied to six boats - isolated tests
on:
  push:
    branches: [research/materials-applied-six-boat-20261020]
    paths:
      - 'research/materials_application_v1/**'
      - '.github/workflows/materials-application-isolated-tests.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify only isolated research files changed
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--name-only','e9b4a6c278ea56af24ce340930f1856b794bdcb6','HEAD'], text=True).splitlines()
          assert files and all(p.startswith('research/materials_application_v1/') or p == '.github/workflows/materials-application-isolated-tests.yml' for p in files), files
          print('Isolated files:', len(files))
          PY
      - name: Run data-use contracts and existing regression tests
        run: python -m unittest research.materials_application_v1.test_application research.materials_v1.test_materials research.venue_fusion_v1.test_engine research.venue_fusion_v1.test_prospective -v
