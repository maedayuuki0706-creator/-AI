name: Race Shape Feature Tests

on:
  push:
    branches: [main]
    paths:
      - "prediction_engine.py"
      - "opportunity_alerts.py"
      - "four_way_prototype.py"
      - "tests/test_race_shape_features.py"
      - ".github/workflows/race-shape-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run race-shape feature tests
        run: python3 -m unittest tests.test_race_shape_features -v
