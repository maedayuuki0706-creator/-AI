name: Four Way Prototype Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'four_way_prototype.py'
      - 'prototype_runner.py'
      - 'tests/test_four_way_prototype.py'
      - '.github/workflows/fusion-prototype.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: fusion-prototype-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four-way comparison invariants
        run: |
          python -m unittest discover -s tests -p 'test_four_way_prototype.py' -v
          python -m py_compile prototype_runner.py four_way_prototype.py
      - name: Verify prototype Discord secrets
        env:
          PROTO1_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO1_DISCORD_WEBHOOK_URL }}
          PROTO2_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO2_DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$PROTO1_DISCORD_WEBHOOK_URL"
          test -n "$PROTO2_DISCORD_WEBHOOK_URL"
      - name: Capture first four-way checkpoint
        env:
          TZ: Asia/Tokyo
          PROTO1_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO1_DISCORD_WEBHOOK_URL }}
          PROTO2_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO2_DISCORD_WEBHOOK_URL }}
          PROTOTYPE_DELIVERY_START_DAY: '20260922'
        run: PROTOTYPE_CODE_SHA="$(git rev-parse HEAD)" python -u prototype_runner.py --watch-seconds 0
      - name: Persist first checkpoint
        if: success()
        run: |
          git config user.name 'boat-ai-learning-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prototypes/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record prospective four-way prototype checkpoint'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
      - name: Watch near-deadline races and settle all four methods
        env:
          TZ: Asia/Tokyo
          PROTO1_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO1_DISCORD_WEBHOOK_URL }}
          PROTO2_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO2_DISCORD_WEBHOOK_URL }}
          PROTOTYPE_DELIVERY_START_DAY: '20260922'
        run: PROTOTYPE_CODE_SHA="$(git rev-parse HEAD)" python -u prototype_runner.py --watch-seconds 240
      - name: Preserve four-way records as execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-way-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/prototypes/
          if-no-files-found: warn
      - name: Persist final predictions, results and missing-race ledger
        if: always()
        run: |
          if [ ! -d data/prototypes ]; then exit 0; fi
          git config user.name 'boat-ai-learning-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prototypes/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record prospective four-way predictions and results'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
