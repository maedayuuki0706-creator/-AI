name: All AI Fusion - Recovery Research Pilot (manual only)

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'JST race day YYYYMMDD; only Karatsu 1-3R, one capture per run'
        required: true
        default: '20261018'

permissions:
  contents: write

concurrency:
  group: fusion-recovery-research-pilot-only
  cancel-in-progress: false

jobs:
  check_and_log:
    if: github.ref == 'refs/heads/research/fusion-log-recovery-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /notification_policy.json
            /tests/test_fusion_shadow.py
            /tests/test_fusion_log_recovery.py
            /research/
            /x_delivery_v2/
            /data/sheet_db/
            /data/racer_profiles.json
            /data/learning_state.json
            /data/venue_tactical_priors.json
            /data/venue_tide_profiles.json
            /data/race_context/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original policy, cutoff, retries and no delivery
        run: |
          python -m unittest discover -s tests -p 'test_fusion_shadow.py' -q
          python -m unittest discover -s tests -p 'test_fusion_log_recovery.py' -q
          python -m unittest discover -s research/venue_specialists_v1/tests -q
      - name: Open independent recovery log state
        run: |
          git fetch --depth=1 origin research-fusion-recovery-state:refs/remotes/origin/research-fusion-recovery-state
          git -c core.sparseCheckout=false worktree add --detach "$RUNNER_TEMP/fusion-recovery-state" refs/remotes/origin/research-fusion-recovery-state
          git -C "$RUNNER_TEMP/fusion-recovery-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/fusion-recovery-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Freeze one eligible original, confirm remote receipt, then review
        env:
          RESEARCH_PILOT_DAY: ${{ inputs.day || '20261018' }}
        run: python -m research.fusion_log_recovery.pilot --state "$RUNNER_TEMP/fusion-recovery-state" --day "$RESEARCH_PILOT_DAY"
      - name: Retain originals and failure stage if interrupted
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-recovery-pilot-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/fusion-recovery-state/data/fusion_shadow/
          retention-days: 7
          if-no-files-found: ignore
