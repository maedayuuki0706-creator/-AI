name: Research materials isolated checks
on:
  push:
    branches: [research/materials-continuous-20261020]
    paths: ['research/materials_v1/**', '.github/workflows/research-materials-ci.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/
            /prediction_engine.py
            /market_structure.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest research.materials_v1.test_materials -v
