name: Opportunity Daily Report
on:
  push:
    branches: [main]
    paths:
      - "opportunity_daily_report.py"
      - ".github/workflows/opportunity_daily_report.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build opportunity report
        env:
          REPORT_DAY: "20260916"
        run: python opportunity_daily_report.py
      - name: Persist opportunity report
        run: |
          git config user.name boat-ai-learning-bot
          git config user.email actions@users.noreply.github.com
          git add data/opportunity_report_20260916.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 20260916 opportunity report"
          git pull --rebase origin main
          git push origin HEAD:main
