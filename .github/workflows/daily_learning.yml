name: Boat AI Daily Learning

on:
  schedule:
    # 23:30 JST = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-ai-daily-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare predictions with official results and update learning state
        run: python daily_learning.py

      - name: Persist evaluated results and learning state
        run: |
          if git diff --quiet -- data/evaluated_results.jsonl data/learning_state.json 2>/dev/null && [ -z "$(git status --porcelain data/evaluated_results.jsonl data/learning_state.json 2>/dev/null)" ]; then
            echo "No learning updates"
            exit 0
          fi
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/evaluated_results.jsonl data/learning_state.json
          git commit -m "Update daily race learning results" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
