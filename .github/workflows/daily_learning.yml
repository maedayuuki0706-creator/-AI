name: Boat AI Daily Learning

on:
  schedule:
    # 23:30 JST = 14:30 UTC
    - cron: "30,50 14 * * *"
    # Retry delayed official results at 00:30 JST, for the previous race day.
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-ai-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Settle virtual plans and send daily Discord report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_report.py --send

      - name: Compare predictions with official results and update learning state
        if: always()
        run: python daily_learning.py

      - name: Persist evaluated results and learning state
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No learning updates"
            exit 0
          fi
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Update daily race learning results" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
