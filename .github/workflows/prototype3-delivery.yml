name: 新人予想家 ゆうき Discord Delivery
# emergency-kick 2026-10-04T16:00+09:00
# schedule-kick 2026-10-04T13:36+09:00

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype3_delivery.py'
      - 'discord_ack.py'
      - 'delivery_v2/**'
      - 'yuuki_hit_alerts.py'
      - 'sokuhou_delivery.py'
      - 'sokuhou_health.py'
      - 'sokuhou_policy.json'
      - 'test_yuuki_hit_alerts.py'
      - 'four_way_prototype.py'
      - 'prototype_scoreboard.py'
      - 'tests/test_prototype_scoreboard.py'
      - '.github/workflows/prototype3-delivery.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  # Preserve the active delivery; durable Sokuhou claims survive interruption.
  group: prototype3-discord-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 新人予想家 ゆうき delivery configuration
        env:
          PT3_DISCORD_WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL }}
          PROTO3_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO3_DISCORD_WEBHOOK_URL }}
        run: |
          python -m py_compile prototype3_delivery.py four_way_prototype.py prototype_scoreboard.py daily_report.py
          python -m unittest discover -s tests -p 'test_prototype_scoreboard.py' -v
          python -m unittest test_yuuki_hit_alerts.py -v
          python -m unittest discover -s tests -p 'test_sokuhou*.py' -v
          python -m unittest discover -s tests -p 'test_delivery_v2*.py' -v
          test -n "$PT3_DISCORD_WEBHOOK_URL$PROTO3_DISCORD_WEBHOOK_URL"
      - name: Deliver 新人予想家 ゆうき
        env:
          TZ: Asia/Tokyo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_DELIVERY_V2_STREAMS: 'yuuki,yuuki_selected'
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          PT3_DISCORD_WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL }}
          PROTO3_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO3_DISCORD_WEBHOOK_URL }}
          PT3_SELECTED_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SELECTED_WEBHOOK_URL }}
          PROTOTYPE3_WATCH_SECONDS: '180'
        run: python -u prototype3_delivery.py
      - name: Score delivered PT1-3 results
        if: always()
        env:
          TZ: Asia/Tokyo
        run: python -u prototype_scoreboard.py
      - name: Verify Sokuhou independent delivery is enabled
        if: always()
        env:
          TZ: Asia/Tokyo
          DISCORD_HIT_WEBHOOK_URL: ${{ secrets.DISCORD_HIT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c 'import sokuhou_delivery; print("Sokuhou paused" if sokuhou_delivery.paused() else "Sokuhou Confirmed Hit Delivery handles confirmed Yuuki results")'
      - name: Audit Sokuhou receipts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sokuhou_health.py
      - name: Persist 新人予想家 ゆうき delivery receipts and PT scoreboard
        if: always()
        run: python persist_runtime_data.py data/prototype3_delivery/ data/prototype_scoreboard/
      - name: Preserve prediction and delivery recovery records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuuki-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/prototype3_delivery/
            data/prototype_scoreboard/
            data/sokuhou_recovery/
            data/delivery_v2_recovery/
          retention-days: 7
