name: 新人予想家 ゆうき Discord Delivery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype3_delivery.py'
      - 'yuuki_hit_alerts.py'
      - 'sokuhou_delivery.py'
      - 'sokuhou_health.py'
      - 'sokuhou_policy.json'
      - 'test_yuuki_hit_alerts.py'
      - 'four_way_prototype.py'
      - 'prototype_scoreboard.py'
      - 'tests/test_prototype_scoreboard.py'
      - '.github/workflows/prototype3-delivery.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  # Preserve the active delivery; durable Sokuhou claims survive interruption.
  group: prototype3-discord-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 新人予想家 ゆうき delivery configuration
        env:
          PT3_DISCORD_WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL }}
          PROTO3_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO3_DISCORD_WEBHOOK_URL }}
        run: |
          python -m py_compile prototype3_delivery.py four_way_prototype.py prototype_scoreboard.py daily_report.py
          python -m unittest discover -s tests -p 'test_prototype_scoreboard.py' -v
          python -m unittest test_yuuki_hit_alerts.py -v
          python -m unittest discover -s tests -p 'test_sokuhou*.py' -v
          test -n "$PT3_DISCORD_WEBHOOK_URL$PROTO3_DISCORD_WEBHOOK_URL"
      - name: Deliver 新人予想家 ゆうき
        env:
          TZ: Asia/Tokyo
          PT3_DISCORD_WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL }}
          PROTO3_DISCORD_WEBHOOK_URL: ${{ secrets.PROTO3_DISCORD_WEBHOOK_URL }}
          PT3_SELECTED_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SELECTED_WEBHOOK_URL }}
          PROTOTYPE3_WATCH_SECONDS: '210'
        run: python -u prototype3_delivery.py
      - name: Score delivered PT1-3 results
        if: always()
        env:
          TZ: Asia/Tokyo
        run: python -u prototype_scoreboard.py
      - name: Notify 速報くん of confirmed ゆうき hits
        if: always()
        env:
          TZ: Asia/Tokyo
          DISCORD_HIT_WEBHOOK_URL: ${{ secrets.DISCORD_HIT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u yuuki_hit_alerts.py
      - name: Audit Sokuhou receipts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sokuhou_health.py
      - name: Preserve confirmed message IDs when receipt saving fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yuuki-sokuhou-recovery-${{ github.run_id }}
          path: data/sokuhou_recovery/
          retention-days: 7
      - name: Persist 新人予想家 ゆうき delivery receipts and PT scoreboard
        if: always()
        run: |
          if [ ! -d data/prototype3_delivery ]; then exit 0; fi
          git config user.name 'boat-ai-delivery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prototype3_delivery/ data/prototype_scoreboard/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record prototype 3 delivery receipts'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
