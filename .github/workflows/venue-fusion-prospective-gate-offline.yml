name: Prospective venue fusion local gate - offline only
on:
  push:
    branches:
      - research/venue-fusion-prospective-gate-20261020
    paths:
      - 'research/venue_fusion_v1/prospective.py'
      - 'research/venue_fusion_v1/test_prospective.py'
      - '.github/workflows/venue-fusion-prospective-gate-offline.yml'
permissions:
  contents: read
jobs:
  no-production-prospective-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research-only fail-closed tests (no official fetching)
        run: |
          python -m py_compile research/venue_fusion_v1/prospective.py
          python -m unittest research.venue_fusion_v1.test_prospective -v
