name: PT2 Sheet Log Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_pt2_prediction_sheet.py'
      - 'pt2_strategy_cards.py'
      - '.github/workflows/pt2-sheet-log-sync.yml'

permissions:
  contents: read

concurrency:
  group: pt2-sheet-log-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sheet writer syntax
        run: python -m py_compile sync_pt2_prediction_sheet.py pt2_strategy_cards.py

      - name: Install Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Backfill and refresh PT2 sheet
        env:
          TZ: Asia/Tokyo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: "1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo"
          PT2_VIEW_SHEET: "PT2予想シート"
          PT2_VIEW_HELPER_SHEET: "PT2予想候補"
          PT2_VIEW_LOG_SHEET: "PT2予想ログ"
        run: python -u sync_pt2_prediction_sheet.py
