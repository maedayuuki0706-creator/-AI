name: Test Prediction Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test_prediction_once.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send detailed Discord prediction test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          msg = """🧪 **競艇AIナビ｜詳細通知テスト**
**若松 11R**　締切予定 **20:07**
予想：独自AI / 展示：取得確認 / 信頼度：B

**◎本線**
1-2-3 / 1-2-4 / 1-2-5 / 1-3-2

**○押さえ**
2-3-1 / 2-1-3 / 2-3-4 / 3-1-2

**△穴候補**
2-3-5

**AI解説**
本線は1号艇の逃げ。2号艇の差し残りを高評価。
3号艇はまくり差しで連下以上の可能性を残す。
インが崩れた場合は2頭・3頭の組み合わせを押さえる。

**各艇AI着順確率**
1号艇：1着 63.4% / 2着 13.5% / 3着 12.0%
2号艇：1着 13.6% / 2着 31.0% / 3着 22.0%
3号艇：1着 11.0% / 2着 20.0% / 3着 24.0%
4号艇：1着 5.2% / 2着 12.5% / 3着 21.7%
5号艇：1着 4.8% / 2着 8.0% / 3着 14.0%
6号艇：1着 2.0% / 2着 7.0% / 3着 6.3%

**主要データ**
1号艇：A1 / 全国勝率 6.82 / 当地 6.45 / 平均ST .14 / モーター2連率 41.2%
2号艇：A1 / 全国勝率 6.31 / 当地 6.02 / 平均ST .15 / モーター2連率 38.0%
3号艇：B1 / 全国勝率 5.47 / 当地 5.91 / 平均ST .16 / モーター2連率 35.4%

**想定展開**
逃げ 63% / 差し 14% / まくり 5% / まくり差し 11%

※これは表示確認用の架空データです。実戦通知ではBOAT RACE公式の当日データを使います。"""

          url = os.environ.get('DISCORD_WEBHOOK_URL','').strip()
          if not url:
              sys.exit(2)
          data = json.dumps({'content': msg, 'allowed_mentions': {'parse': []}}, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type':'application/json','User-Agent':'Boat-AI-Detail-Test/1.0'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  if r.status not in (200, 204):
                      sys.exit(1)
          except Exception:
              sys.exit(1)
          PY
          code=$?
          if [ "$code" -eq 0 ]; then
            state=success
            description="Detailed Discord prediction test accepted"
          else
            state=failure
            description="Detailed Discord prediction test failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"boat-ai/discord-detail-test\",\"description\":\"${description}\"}"
          exit "$code"
