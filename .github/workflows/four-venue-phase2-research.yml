name: Four Venue Phase 2 - Independent Manual Research
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, capture]
        default: preflight
      venue:
        type: choice
        options: ['03', '16', '23', '06']
        default: '03'
      race:
        type: number
        default: 1
# No cron, workflow_run, push or production-workflow modification.
permissions:
  contents: write
  actions: read
concurrency:
  group: four-venue-phase2-independent
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/four-venue-phase2-20261018
          persist-credentials: false
      - name: Yield to active production or other research
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m research.four_venue_phase2.resource_guard --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" > guard.json
          python3 -c 'import json,os; r=json.load(open("guard.json")); print(r); open(os.environ["GITHUB_OUTPUT"],"a").write("allowed="+str(r["allowed"]).lower()+"\n")'
      - uses: actions/checkout@v4
        if: steps.guard.outputs.allowed == 'true' && inputs.mode == 'capture'
        with:
          ref: research-venue-specialists-state
          path: baseline-state
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.guard.outputs.allowed == 'true' && inputs.mode == 'capture'
        with:
          ref: research-four-venue-phase2-state
          path: phase2-state
      - name: Preflight without predictions or writes
        if: steps.guard.outputs.allowed == 'true' && inputs.mode == 'preflight'
        run: |
          for venue in 03 16 23 06; do
            python3 -m research.four_venue_phase2.shadow --mode preflight --model "research/four_venue_phase2/model_manifests/$venue.json" --state unused
          done
      - name: Capture once from the unchanged existing input
        if: steps.guard.outputs.allowed == 'true' && inputs.mode == 'capture'
        env:
          RESEARCH_VENUE: ${{ inputs.venue }}
          RESEARCH_RACE: ${{ inputs.race }}
        run: |
          git -C phase2-state config user.name research-phase2-bot
          git -C phase2-state config user.email research-phase2-bot@users.noreply.github.com
          python3 -m research.four_venue_phase2.shadow --mode capture --publish --model "research/four_venue_phase2/model_manifests/$RESEARCH_VENUE.json" --state phase2-state --source-state baseline-state --rno "$RESEARCH_RACE"
