name: 新人予想家 ゆうき Discord Delivery Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prototype3-discord-test.yml'

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Prototype 3 webhook
        env:
          WEBHOOK_URL: ${{ secrets.PT3_DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "PT3_DISCORD_WEBHOOK_URL is not set"
            exit 1
          fi
          curl -fsS -H "Content-Type: application/json" \
            -d '{"username":"新人予想家 ゆうき","content":"🏆 新人予想家 ゆうき｜配信テスト成功\n本線：日和\n抑え：中穴くん＋日和"}' \
            "$WEBHOOK_URL"
