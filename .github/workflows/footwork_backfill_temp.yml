name: Footwork Backfill Temp

on:
  push:
    branches: [sheet-auto-update]
    paths:
      - ".github/workflows/footwork_backfill_temp.yml"
      - "data/footwork_backfill_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footwork-backfill-temp
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sheet-auto-update

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect batch 2 footwork and results
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          import sheet_feed_server as s

          jobs = [
              ("04","平和島","20260914","20260919"),
              ("05","多摩川","20260925","20260930"),
              ("06","浜名湖","20260919","20260924"),
          ]
          outdir = Path("data/footwork_backfill/batch2")
          outdir.mkdir(parents=True, exist_ok=True)
          summary = {}
          all_foot = []
          all_results = []
          for jcd, venue, start, end in jobs:
              foot = s.section_footwork_rows(start, end, jcd)
              results = s.section_result_rows(start, end, jcd)
              summary[venue] = {
                  "footwork_rows": len(foot),
                  "result_rows": len(results),
                  "start": start,
                  "end": end,
              }
              with (outdir / f"{jcd}_{start}_{end}_footwork.csv").open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.writer(f); w.writerow(s.FOOTWORK_HEADER); w.writerows(foot)
              with (outdir / f"{jcd}_{start}_{end}_results.csv").open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.writer(f); w.writerow(s.RESULT_HEADER); w.writerows(results)
              all_foot.extend(foot)
              all_results.extend(results)

          with (outdir / "batch2_footwork.csv").open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f); w.writerow(s.FOOTWORK_HEADER); w.writerows(all_foot)
          with (outdir / "batch2_results.csv").open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f); w.writerow(s.RESULT_HEADER); w.writerows(all_results)
          (outdir / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Commit batch 2 output
        run: |
          if [ -z "$(git status --porcelain data/footwork_backfill/batch2/)" ]; then
            echo "No backfill changes"
            exit 0
          fi
          git config user.name "boat-ai-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/footwork_backfill/batch2/
          git commit -m "Backfill batch 2 venue footwork data"
          git pull --rebase origin sheet-auto-update
          git push origin HEAD:sheet-auto-update
