name: X Prediction Rationale Sync

on:
  workflow_dispatch:
    inputs:
      target_day:
        description: YYYYMMDD to backfill (blank = today JST)
        required: false
        default: ""
  schedule:
    - cron: '13,28,43,58 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_x_reason_log.py'
      - '.github/workflows/x-reason-log-sync.yml'

permissions:
  contents: read

concurrency:
  group: x-reason-log-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify X rationale sync
        run: python -m py_compile sync_x_reason_log.py

      - name: Install Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Sync X rationale log
        env:
          TZ: Asia/Tokyo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: "1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo"
          X_REASON_SHEET: "X予想根拠ログ"
          TARGET_DAY: ${{ github.event.inputs.target_day || '' }}
        run: python -u sync_x_reason_log.py
