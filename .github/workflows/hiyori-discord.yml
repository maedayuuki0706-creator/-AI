name: Hiyori AI Discord
on:
  push:
    branches: [main]
    paths:
      - 'hiyori_*.py'
      - '.github/workflows/hiyori-discord.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hiyori-ai-discord
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deliver Hiyori predictions
        env:
          HIYORI_DISCORD_WEBHOOK_URL: ${{ secrets.HIYORI_DISCORD_WEBHOOK_URL }}
          TZ: Asia/Tokyo
        run: timeout --signal=INT 480 python -u hiyori_live_runner.py
      - name: Persist Hiyori delivery receipts and comparisons
        if: always()
        run: |
          mkdir -p data/hiyori
          git add data/hiyori/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'boat-ai-learning-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Record Hiyori predictions and results'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hiyori-delivery-records-${{ github.run_id }}
          path: data/hiyori/
