name: Unified Live Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "live_status.py"
      - "selected_metrics.py"
      - "prototype_scoreboard.py"
      - "data/prediction_log.jsonl"
      - "data/opportunity_alert_deliveries.jsonl"
      - "data/hiyori/**"
      - "data/prototype12_delivery/**"
      - "data/prototype3_delivery/**"
      - ".github/workflows/live-status.yml"

permissions:
  contents: write

concurrency:
  group: unified-live-status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate live status builder
        run: python -m py_compile live_status.py

      - name: Build current confirmed scoreboard
        env:
          TZ: Asia/Tokyo
        run: python -u live_status.py

      - name: Persist live scoreboard
        run: |
          mkdir -p data/live_status
          git config user.name 'boat-ai-live-status-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live_status/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh unified live status'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
