name: Yuuki requested 20260927 cutoff reports
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yuuki-report-20260927-17.yml
permissions:
  contents: write
concurrency:
  group: yuuki-requested-20260927-17
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send cutoff results to dedicated daily report channel
        env:
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
        run: |
          python yuuki_report_20260927_17.py --hour 13
          python yuuki_report_20260927_17.py --hour 15
      - name: Persist snapshot and acknowledgement
        if: always()
        run: |
          git config user.name boat-ai-report-bot
          git config user.email actions@users.noreply.github.com
          git add data/yuuki_interim_reports/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record requested Yuuki 20260927 13 and 15 report acknowledgements'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
