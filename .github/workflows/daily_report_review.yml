name: Boat AI Daily Report Review

on:
  workflow_dispatch:
    inputs:
      day:
        description: Race day in JST (YYYYMMDD)
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "daily_report.py"
      - "daily_report_format.py"
      - "stake_simulation_3000.py"
      - ".github/workflows/daily_report_review.yml"

permissions:
  contents: write

concurrency:
  group: boat-ai-report-review
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Send daily review ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify separate report channel
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from direct_discord_notify import UA

          def channel_for(name):
              url = os.environ.get(name, '').strip()
              if not url:
                  raise SystemExit(f'{name} is not configured')
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != 'https'
                      or parsed.netloc not in {'discord.com', 'discordapp.com', 'ptb.discord.com', 'canary.discord.com'}
                      or not re.fullmatch(r'/api(?:/v\d+)?/webhooks/\d+/[^/]+/?', parsed.path)):
                  raise SystemExit(f'{name} is not a Discord webhook URL')
              request = urllib.request.Request(url, headers={'User-Agent': UA})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      channel = str(json.load(response).get('channel_id', ''))
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'{name}: Discord HTTP {exc.code}') from None
              except Exception as exc:
                  raise SystemExit(f'{name}: connection failed ({type(exc).__name__})') from None
              if not channel.isdigit():
                  raise SystemExit(f'{name}: Discord returned no channel ID')
              return channel

          report_channel = channel_for('DISCORD_REPORT_WEBHOOK_URL')
          prediction_channel = channel_for('DISCORD_WEBHOOK_URL')
          if report_channel == prediction_channel:
              raise SystemExit('Report and prediction webhooks point to the same channel')
          print('Report channel verified: distinct from predictions')
          PY
      - name: Build 3000 yen stake simulation
        env:
          REPORT_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.day || '20260913' }}
        run: python stake_simulation_3000.py --day "$REPORT_DAY"
      - name: Send reviewed daily report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          REPORT_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.day || '20260913' }}
        run: python daily_report.py --day "$REPORT_DAY" --saved-results --send
      - name: Persist acknowledged reports
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            exit 0
          fi
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Record reviewed daily report and confirmed deliveries"
          git pull --rebase origin main
          git push origin HEAD:main
