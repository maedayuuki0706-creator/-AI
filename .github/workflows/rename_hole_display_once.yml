name: Rename Hole Prediction Display Once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rename_hole_display_once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rename display labels
        run: python rename_hole_display_once.py
      - name: Commit changes
        run: |
          git config user.name boat-ai-learning-bot
          git config user.email actions@users.noreply.github.com
          git add opportunity_alerts.py send_opportunity_daily_discord.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rename hole AI display to hole prediction"
          git pull --rebase origin main
          git push origin HEAD:main
