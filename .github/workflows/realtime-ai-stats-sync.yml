name: Realtime AI Stats Sync

on:
  workflow_dispatch:
    inputs:
      target_day:
        description: YYYYMMDD to backfill (blank = today JST)
        required: false
        default: ""
  schedule:
    - cron: '1-56/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_realtime_ai_stats.py'
      - '.github/workflows/realtime-ai-stats-sync.yml'

permissions:
  contents: read

concurrency:
  group: realtime-ai-stats-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify realtime AI stats sync
        run: python -m py_compile sync_realtime_ai_stats.py

      - name: Install Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Sync realtime AI performance
        env:
          TZ: Asia/Tokyo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: "1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo"
          LIVE_AI_LOG_SHEET: "リアルタイムAI成績ログ"
          LIVE_AI_VIEW_SHEET: "リアルタイムAI成績"
          TARGET_DAY: ${{ github.event.inputs.target_day || '' }}
        run: python -u sync_realtime_ai_stats.py
