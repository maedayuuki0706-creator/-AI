name: Add Selected Mid Intro Once

on:
  push:
    branches: [main]
    paths:
      - "add_selected_mid_intro_once.py"
      - ".github/workflows/add_selected_mid_intro_once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply intro patch
        run: python add_selected_mid_intro_once.py

      - name: Verify syntax
        run: python -m py_compile opportunity_alerts.py

      - name: Commit patched file
        run: |
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add opportunity_alerts.py
          git commit -m "Randomize selected mid-odds intro copy" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
