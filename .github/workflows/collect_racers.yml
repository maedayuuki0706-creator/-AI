name: Collect racer database
on:
  workflow_dispatch:
    inputs:
      start:
        description: Start racer number
        required: true
        default: "3388"
      end:
        description: End racer number
        required: true
        default: "4150"
  push:
    paths:
      - ".github/workflows/collect_racers.yml"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Collect
        run: python tools/racer_collector.py ${{ github.event.inputs.start || '3388' }} ${{ github.event.inputs.end || '4150' }}
      - name: Commit CSV
        run: |
          git config user.name "boat-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/racers_*.csv
          git diff --cached --quiet || git commit -m "Update racer database"
          git push
