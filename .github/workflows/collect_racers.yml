name: Collect racer database
on:
  workflow_dispatch:
    inputs:
      start:
        description: Start racer number
        required: true
        default: "3388"
      end:
        description: End racer number
        required: true
        default: "4150"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Syntax check
        run: python -m py_compile tools/racer_collector.py

      - name: Collect with checkpoints
        run: python tools/racer_collector.py ${{ inputs.start }} ${{ inputs.end }}

      - name: Upload current CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racer-checkpoint-${{ github.run_id }}
          path: data/racers_*.csv
          if-no-files-found: warn

      - name: Commit CSV when present
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(data/racers_*.csv)
          if (( ${#files[@]} == 0 )); then
            echo "No racer CSV checkpoint yet"
            exit 0
          fi
          git config user.name "boat-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No CSV changes"
            exit 0
          fi
          git commit -m "Update racer database checkpoint"
          git push
