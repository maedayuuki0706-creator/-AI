name: Boat AI Discord Notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "direct_discord_notify.py"
      - "detailed_discord_notify.py"
      - "morning_all_races_discord.py"
      - "virtual_betting.py"
      - "notification_policy.json"

permissions:
  contents: write

concurrency:
  group: boat-ai-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify prediction and settlement rules
        run: python -m unittest discover -s tests -v

      - name: Run detailed BOAT RACE official -> AI -> Discord notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python detailed_discord_notify.py

      - name: Report current progress after a notifier update
        if: always() && github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_report.py --send

      - name: Persist newly delivered predictions
        if: always()
        run: |
          mkdir -p data/race_cards data/official_results data/daily_reports
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No new prediction log"
            exit 0
          fi
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Log delivered race predictions" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
