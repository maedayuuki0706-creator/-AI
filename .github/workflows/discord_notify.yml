name: Boat AI Discord Notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discord_notify.yml"
      - "detailed_discord_notify.py"
      - "direct_discord_notify.py"
      - "morning_all_races_discord.py"
      - "virtual_betting.py"
      - "notification_policy.json"
      - "race_notices.py"
      - "notification_runner.py"
      - "prediction_recap.py"

permissions:
  contents: write

concurrency:
  group: boat-ai-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deliver predictions and race status notices
        if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Send 20260914 prediction summary')) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_WATCH_SECONDS: ${{ github.event_name == 'schedule' && '600' || '0' }}
        run: python notification_runner.py

      - name: Send grouped 2026-09-14 prediction summary
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Send 20260914 prediction summary') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          SUMMARY_ONLY: "1"
          SUMMARY_DAY: "20260914"
        run: python notification_runner.py

      - name: Persist newly delivered predictions
        if: always()
        run: |
          mkdir -p data/race_cards data/official_results data/daily_reports
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No new prediction log"
            exit 0
          fi
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Log delivered race predictions" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
