name: Boat AI Discord Notify
# schedule-kick 2026-10-04T13:36+09:00
# continuous race-day watcher: bridge delayed GitHub schedule launches

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discord_notify.yml"
      - "detailed_discord_notify.py"
      - "direct_discord_notify.py"
      - "discord_ack.py"
      - "morning_all_races_discord.py"
      - "virtual_betting.py"
      - "notification_policy.json"
      - "race_notices.py"
      - "notification_runner.py"
      - "delivery_guard.py"
      - "delivery_guard_runner.py"
      - "bridge_learning.py"
      - "daily_learning.py"
      - "mid_value_selection.py"
      - "opportunity_alerts.py"
      - "opportunity_character.py"
      - "opportunity_scenario_commentary.py"
      - "send_opportunity_daily_discord.py"
      - "backfill_suminoe_20260916.py"
      - "backfill_night12_20260916.py"
      - "prediction_recap.py"
      - "hit_alerts.py"
      - "hit_alerts_fast.py"
      - "sokuhou_delivery.py"
      - "sokuhou_health.py"
      - "sokuhou_policy.json"
      - "persist_runtime_data.py"
      - "tests/test_sokuhou_delivery.py"
      - "tests/test_hit_alerts_fast.py"
      - "tests/test_persist_runtime_data.py"
      - "sokuhou_character.py"
      - "selection_scoring.py"
      - "stake_tracking.py"
      - "x_post_delivery.py"
      - "x_delivery_store.py"
      - "x_delivery_policy.py"

permissions:
  contents: write

# Keep one watcher alive long enough to bridge GitHub schedule delays.
# New scheduled runs may queue; they must never cancel the active notifier.
concurrency:
  # Preserve the active watcher until its receipts are checkpointed.
  group: boat-ai-discord-notify-main
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Sokuhou restart and persistence guards
        run: |
          python -m unittest discover -s tests -p 'test_sokuhou*.py' -v
          python -m unittest discover -s tests -p 'test_hit_alerts*.py' -v
          python -m unittest discover -s tests -p 'test_persist_runtime_data.py' -v
          python -m unittest discover -s tests -p 'test_discord_ack.py' -v
          python -m unittest discover -s tests -p 'test_discord_notification_policy.py' -v

      - name: Check X live delivery backend
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python x_post_delivery.py --check-render

      - name: Verify durable Sokuhou receipt storage without posting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c 'from sokuhou_delivery import STORE; STORE.ensure(); print("Sokuhou receipt branch ready")'

      - name: Refresh near-miss learning state
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Refresh near-miss learning state') }}
        run: python daily_learning.py

      - name: Restore exact prediction journals recovered from failed runs
        run: |
          python recover_delivery_journals.py
          python persist_runtime_data.py data/prediction_log.jsonl data/opportunity_alert_deliveries.jsonl data/race_status_log.jsonl

      - name: Deliver predictions and race status notices
        if: ${{ !(github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'Send 20260914 prediction summary') || startsWith(github.event.head_commit.message, 'Backfill missed Suminoe') || startsWith(github.event.head_commit.message, 'Backfill missed night 12R') || startsWith(github.event.head_commit.message, 'Send 20260916 mid-odds daily reports'))) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SELECTED_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SELECTED_WEBHOOK_URL }}
          DISCORD_HIT_WEBHOOK_URL: ${{ secrets.DISCORD_HIT_WEBHOOK_URL }}
          SOKUHOU_EXTERNAL_RUNNER: '1'
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_MID_ODDS: ${{ secrets.DISCORD_WEBHOOK_MID_ODDS }}
          DISCORD_WEBHOOK_MID_ODDS_SELECTED: ${{ secrets.DISCORD_SELECTED_WEBHOOK_URL }}
          DISCORD_WEBHOOK_LONGSHOT: ${{ secrets.DISCORD_WEBHOOK_LONGSHOT }}
          X_POST_DISCORD_WEBHOOK_URL: ${{ secrets.X_POST_DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled launches can be hours late; every start must keep polling.
          NOTIFY_WATCH_SECONDS: '480'
          X_ASYNC_DELIVERY: "1"
        run: python delivery_guard_runner.py

      - name: Send missed Suminoe 5-7R retrospective cards
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Backfill missed Suminoe') }}
        env:
          DISCORD_WEBHOOK_MID_ODDS: ${{ secrets.DISCORD_WEBHOOK_MID_ODDS }}
          DISCORD_WEBHOOK_LONGSHOT: ${{ secrets.DISCORD_WEBHOOK_LONGSHOT }}
        run: python backfill_suminoe_20260916.py

      - name: Send missed night 12R retrospective cards
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Backfill missed night 12R') }}
        env:
          DISCORD_WEBHOOK_MID_ODDS: ${{ secrets.DISCORD_WEBHOOK_MID_ODDS }}
          DISCORD_WEBHOOK_LONGSHOT: ${{ secrets.DISCORD_WEBHOOK_LONGSHOT }}
        run: python backfill_night12_20260916.py

      - name: Send grouped 2026-09-14 prediction summary
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Send 20260914 prediction summary') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          SELECTED_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SELECTED_WEBHOOK_URL }}
          DISCORD_HIT_WEBHOOK_URL: ${{ secrets.DISCORD_HIT_WEBHOOK_URL }}
          SUMMARY_ONLY: "1"
          SUMMARY_DAY: "20260914"
        run: python notification_runner.py

      - name: Send 2026-09-16 mid-odds venue daily reports
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Send 20260916 mid-odds daily reports') }}
        env:
          DISCORD_WEBHOOK_MID_ODDS: ${{ secrets.DISCORD_WEBHOOK_MID_ODDS }}
          REPORT_DAY: "20260916"
        run: python send_opportunity_daily_discord.py

      - name: Refresh delivered-only AI and venue standings
        if: always()
        continue-on-error: true
        run: python live_status.py

      - name: Persist newly delivered predictions
        id: persist_runtime
        if: always()
        continue-on-error: true
        run: python persist_runtime_data.py data/ --exclude data/x_post_delivery/

      - name: Sync archived selected predictions to X via Render
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python x_post_delivery.py --sync-render

      - name: Persist X delivery receipts
        if: always()
        run: python persist_runtime_data.py data/x_post_delivery/

      - name: Preserve runtime journals after every delivery pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            data/*log.jsonl
            data/*deliveries.jsonl
            data/x_post_delivery/
            data/sokuhou_recovery/
            data/exhibition_log/
            data/discord_prediction_receipts/

      - name: Audit Sokuhou receipts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sokuhou_health.py
