name: Boat AI Discord Notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-ai-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run detailed BOAT RACE official -> AI -> Discord notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python detailed_discord_notify.py

      - name: Persist newly delivered predictions
        if: always()
        run: |
          if git diff --quiet -- data/prediction_log.jsonl 2>/dev/null && [ -z "$(git status --porcelain data/prediction_log.jsonl 2>/dev/null)" ]; then
            echo "No new prediction log"
            exit 0
          fi
          git config user.name "boat-ai-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prediction_log.jsonl
          git commit -m "Log delivered race predictions" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main