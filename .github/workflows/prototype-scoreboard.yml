name: Prototype PT1-3 Scoreboard

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'YYYYMMDD (blank = current JST day)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'prototype_scoreboard.py'
      - 'tests/test_prototype_scoreboard.py'
      - '.github/workflows/prototype-scoreboard.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: prototype-pt1-3-scoreboard
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scoreboard
        run: |
          python -m py_compile prototype_scoreboard.py daily_report.py four_way_prototype.py
          python -m unittest discover -s tests -p 'test_prototype_scoreboard.py' -v
      - name: Score delivered PT1-3 predictions
        env:
          TZ: Asia/Tokyo
          SCORE_DAY: ${{ github.event.inputs.day || '' }}
        run: |
          if [ -n "$SCORE_DAY" ]; then
            python -u prototype_scoreboard.py --day "$SCORE_DAY"
          else
            python -u prototype_scoreboard.py
          fi
      - name: Persist PT1-3 results and summary
        run: |
          if [ ! -d data/prototype_scoreboard ]; then exit 0; fi
          git config user.name 'boat-ai-scoreboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prototype_scoreboard/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update PT1-3 scoreboard'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
