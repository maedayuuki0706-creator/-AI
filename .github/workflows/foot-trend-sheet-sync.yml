name: Foot Trend Sheet Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '9,24,39,54 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync_foot_trend_sheet.py'
      - 'exhibition_log.py'
      - '.github/workflows/foot-trend-sheet-sync.yml'

permissions:
  contents: read

concurrency:
  group: foot-trend-sheet-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify foot trend sync
        run: python -m py_compile sync_foot_trend_sheet.py exhibition_log.py direct_discord_notify.py

      - name: Install Google Sheets client
        run: pip install "gspread>=6,<7" "google-auth>=2,<3"

      - name: Sync exhibition and result differences
        env:
          TZ: Asia/Tokyo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOAT_SHEET_ID: "1dbUPyfxjIRaT-G8F_LlGMX7Ld_ZB951UmF4HpW_PYJo"
          FOOT_TREND_SHEET: "足回り推移"
        run: python -u sync_foot_trend_sheet.py
