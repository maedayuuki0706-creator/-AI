name: Yuuki EV Research Independent - No Notifications
on:
  workflow_dispatch:
  schedule:
    # UTC: JST 08:11 through 00:56. Separate from production schedules.
    - cron: '11,26,41,56 23,0-15 * * *'
  push:
    branches: [main]
    paths: [.github/workflows/yuuki-ev-research-independent.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: yuuki-ev-research-independent-only
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Yield research if existing workflows are queued or capacity is busy
        id: capacity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          queued=json.load(urllib.request.urlopen(urllib.request.Request(root+'?status=queued&per_page=1',headers=headers),timeout=10))['total_count']
          busy=json.load(urllib.request.urlopen(urllib.request.Request(root+'?status=in_progress&per_page=1',headers=headers),timeout=10))['total_count']
          enabled=queued==0 and busy<10
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('enabled='+str(enabled).lower()+'\n')
          print('research capacity gate: queued='+str(queued)+' in_progress='+str(busy)+' enabled='+str(enabled))
          PY
      - uses: actions/checkout@v4
        if: steps.capacity.outputs.enabled == 'true'
        with:
          ref: research/yuuki-ev-independent-20261014
          sparse-checkout: |
            research/yuuki_ev
            data/research_yuuki_ev
          fetch-depth: 1
      - uses: actions/setup-python@v5
        if: steps.capacity.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/yuuki_ev/requirements.txt
      - name: Test independently without sending messages
        if: steps.capacity.outputs.enabled == 'true'
        run: python -m unittest research.yuuki_ev.test_core -v
      - name: Install isolated research dependencies
        if: steps.capacity.outputs.enabled == 'true'
        run: pip install --quiet -r research/yuuki_ev/requirements.txt
      - name: Save forecasts, receipts, official results and EV metrics to research only
        if: steps.capacity.outputs.enabled == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m research.yuuki_ev.service
      - name: Persist only independent research state, including failures
        if: always() && steps.capacity.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research_yuuki_ev/
          if ! git diff --cached --quiet; then
            git commit -m 'research: independent Yuuki EV observations [skip render]'
            git push origin HEAD:refs/heads/research/yuuki-ev-independent-20261014
          fi
