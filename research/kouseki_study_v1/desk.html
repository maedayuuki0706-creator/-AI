<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>航跡 — BOAT LAB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#183237;font:16px/1.65 system-ui,sans-serif}header{background:#113c42;color:white;padding:20px max(16px,calc((100vw - 1080px)/2))}h1{font-size:25px;margin:0}main{max-width:1080px;margin:auto;padding:16px}nav{padding:10px 0;position:sticky;top:0;background:#f3f5f2;z-index:1}select,input{font:inherit;padding:8px;max-width:100%;margin:4px;border:1px solid #aebdb9;border-radius:5px;background:white}h2{font-size:21px}.scroll{overflow:auto;margin:12px 0 20px;border:1px solid #c6d5d2;border-radius:6px;background:white}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:7px 12px;text-align:left;border-bottom:1px solid #d5dfdc;white-space:nowrap}th{background:#deebe8}#p1 tbody tr:nth-child(1) td:first-child{background:white}#p1 tbody tr:nth-child(2) td:first-child{background:#252525;color:white}#p1 tbody tr:nth-child(3) td:first-child{background:#ad201a;color:white}#p1 tbody tr:nth-child(4) td:first-child{background:#1752a1;color:white}#p1 tbody tr:nth-child(5) td:first-child{background:#f1c934}#p1 tbody tr:nth-child(6) td:first-child{background:#17683f;color:white}td.r1{background:#ffd8d5}td.r2{background:#fff0a8}summary{cursor:pointer;padding:7px}[hidden]{display:none!important}small{color:#d1e6e4}
</style><header><h1>航跡 — BOAT LAB</h1><small>専属アナリスト研究室　保存レース検証</small></header><main><nav><label>研究画面 <select id="page">@@MENU@@</select></label></nav>@@PAGES@@</main>
<script>
const select=document.getElementById('page'), sections=[...document.querySelectorAll('section')];
function show(){sections.forEach(s=>s.hidden=s.id!==select.value)}
select.onchange=show;show();
document.querySelector('#search').oninput=e=>{for(const r of document.querySelectorAll('#p2 tbody tr'))r.hidden=!r.innerText.replace(/\s/g,'').includes(e.target.value.replace(/\s/g,''))};
const data=@@DATA@@,attacker=document.querySelector('#attacker'),method=document.querySelector('#method');
function simulate(){const rows=data.filter(r=>r.attacker===Number(attacker.value)&&r.deciding_method===method.value), n=rows.reduce((a,r)=>a+r.n,0);
let html='<p>条件一致 '+n+'レース</p>';if(n){html+='<div class="scroll"><table><tr><th>実コース</th><th>2着 件数（%）</th><th>3着 件数（%）</th></tr>';for(let c=1;c<=6;c++){html+='<tr><td>'+c+'</td>';for(const key of ['second','third']){const k=rows.filter(r=>r[key]===c).reduce((a,r)=>a+r.n,0);html+='<td>'+k+'（'+(100*k/n).toFixed(1)+'%）</td>'}html+='</tr>'}html+='</table></div>'}document.querySelector('#conditional').innerHTML=html}
method.value='逃げ';attacker.onchange=method.onchange=simulate;simulate();
const orderInput=document.querySelector('#order'),lineStats=JSON.parse(document.querySelector('#line_stats').textContent);
function redrawOrder(){const target=document.querySelector('#order_result');target.replaceChildren();const order=[...orderInput.value];
if(order.slice().sort().join('')!=='123456'){target.textContent='1〜6を重複なく入力してください。';return}
for(let i=0;i<6;i++){const item=lineStats[order[i]],line=document.createElement('div');line.textContent=(i+1)+'コース　'+order[i]+'号艇 '+item.name+'　1着 '+(item.stats[String(i+1)]||'0件');target.appendChild(line)}}
orderInput.oninput=redrawOrder;redrawOrder();
</script></html>
